<!doctype html>
<!-- THROWAWAY — Story 0.4 spike player. Not production code; delete after Epic 0. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Spike 0.4 — scrub player (throwaway)</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0d10; color: #d8d2c4; }
      /* Hidden scrollbar; native scrolling (wheel/touch) untouched. */
      html { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
      #stage { position: fixed; inset: 0; overflow: hidden; }
      #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
      #outline { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
      /* Debug outline: cyan + dark halo so it reads on the warm monitor glow and on dark areas. */
      #outline polygon { fill: none; stroke: #19e3ff; stroke-width: 2; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 1px #000); }
      #spacer { width: 1px; }
      #error { position: fixed; left: 16px; right: 16px; top: 40%; font: 16px/1.4 system-ui, sans-serif; color: #f0b9a0; text-align: center; }
      #hud { position: fixed; left: 8px; top: 8px; z-index: 10; max-width: calc(100vw - 16px); padding: 8px 10px; background: rgba(10, 12, 16, 0.78); color: #e8e2d4; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space: pre; border-radius: 6px; }
      #hud button { margin-top: 6px; font: inherit; padding: 4px 8px; }
      #hud textarea { display: block; margin-top: 6px; width: min(80vw, 420px); height: 120px; font: 10px/1.3 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <svg id="outline" aria-hidden="true"><polygon points="" style="display: none"></polygon></svg>
    </div>
    <div id="spacer"></div>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
