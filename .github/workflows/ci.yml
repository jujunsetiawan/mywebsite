name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main midway through a production deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Explicit bash => `-eo pipefail`, so `cmd | tee` fails when cmd fails.
    shell: bash

jobs:
  # Quality gate: every deploy job needs it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Budgets (first-load, static assets, layer imports)
        run: npm run budgets

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # PR preview: a new Worker version reachable at the `pr-<n>` preview alias.
  # Same-repo PRs only (fork PRs get no secrets).
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      SITE_ENV: preview
      WRANGLER_SEND_METRICS: 'false'
    # Cloudflare secrets are scoped to the steps that need them, never to
    # `npm ci` (install scripts), the build or Playwright.
    steps:
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Cloudflare secrets missing::GitHub secret(s) not set:$missing. Follow infra/README.md (one-time setup) to add them."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SITE_ENV=preview)
        run: npm run build

      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${HEAD_SHA::7}" \
            2>&1 | tee wrangler-upload.log

      - name: Parse preview URL
        id: preview
        run: |
          url="$(grep -m1 'Version Preview Alias URL' wrangler-upload.log | grep -oE 'https://[^[:space:]]+' || true)"
          if [ -z "$url" ]; then
            echo "::error title=Preview URL not found::No 'Version Preview Alias URL' line in the wrangler output (see the previous step). Not commenting a guessed URL."
            exit 1
          fi
          echo "Preview URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- jun-portfolio-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              `**Preview:** ${url}`,
              '',
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\` · alias \`pr-${context.issue.number}\` · \`SITE_ENV=preview\` (noindex, no analytics)`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium

      - name: Deployed smoke tests
        env:
          DEPLOY_URL: ${{ steps.preview.outputs.url }}
        run: npx playwright test --project=chromium

  # Production: deploy main to the workers.dev URL.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_ENV: production
      WRANGLER_SEND_METRICS: 'false'
    # Cloudflare secrets are scoped to the steps that need them, never to
    # `npm ci` (install scripts), the build or Playwright.
    steps:
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Cloudflare secrets missing::GitHub secret(s) not set:$missing. Follow infra/README.md (one-time setup) to add them."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SITE_ENV=production)
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "main @ ${GITHUB_SHA::7}" 2>&1 | tee wrangler-deploy.log

      - name: Parse production URL
        id: production
        run: |
          url="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' wrangler-deploy.log | head -n1 || true)"
          if [ -z "$url" ]; then
            echo "::error title=Production URL not found::No workers.dev URL in the wrangler deploy output (see the previous step)."
            exit 1
          fi
          configured="$(node -p "require('./config/site.production.json').productionOrigin")"
          if [ "$url" != "$configured" ]; then
            echo "::warning title=productionOrigin mismatch::Deployed to $url but config/site.production.json has $configured. Update it (see infra/README.md)."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium

      - name: Deployed smoke tests
        env:
          DEPLOY_URL: ${{ steps.production.outputs.url }}
        run: npx playwright test --project=chromium
